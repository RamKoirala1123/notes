<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>
  
  <!-- Subtle inner ambient glow ring -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#iconGrad)" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Note Book Icon -->
  <g transform="translate(128, 128) scale(10.666)">
    <!-- Book Spine & Pages -->
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Note Page Horizontal Lines -->
    <line x1="9" y1="7" x2="16" y2="7" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="11" x2="16" y2="11" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="9" y1="15" x2="13" y2="15" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
